# Preferred languages for audio and subtitles to be default choice when selecting file streams. Streams could be re-selected per-file.
languages: [RUS, ENG]


# Uncomment if you need custom paths to ffmpeg binaries.
ffmpeg_path: /var/packages/ffmpeg/target/bin/ffmpeg
ffprobe_path: /var/packages/ffmpeg/target/bin/ffprobe

